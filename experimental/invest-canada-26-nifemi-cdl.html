<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invest Canada '26 — Nifemi Oguntuase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    body {
      background: #d0d0d0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Inter', sans-serif;
    }

    /* ── CARD: matches PDF square format ── */
    .card {
      width: 720px;
      max-width: 100%;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    }

    /* ══════════════════════════════
       TOP LOGO BAR
    ══════════════════════════════ */
    .top-bar {
      padding: 18px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #F5C800;
    }

    /* Syntra logo — left */
    .syntra-logo {
      display: flex;
      align-items: center;
    }
    .syntra-img {
      height: 52px;
      width: auto;
      display: block;
    }

    /* Invest Canada badge — right */
    .invest-badge {
      text-align: right;
    }
    .invest-badge-line1 {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #0D1B2A;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .invest-badge-line2 {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #0D1B2A;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* ══════════════════════════════
       HERO CONTENT AREA
    ══════════════════════════════ */
    .hero {
      padding: 22px 24px 0;
      background: #fff;
      position: relative;
    }

    /* Heading row with CVCA badge */
    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .hero-text { flex: 1; }

    .sub-heading {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #0D1B2A;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .main-heading-event {
      font-size: clamp(2.4rem, 5.5vw, 3.4rem);
      font-weight: 900;
      line-height: 0.92;
      color: #F5C800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .main-heading-location {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 900;
      line-height: 0.95;
      color: #0D1B2A;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-top: 2px;
    }

    /* CVCA badge */
    .cvca-badge {
      flex-shrink: 0;
      text-align: right;
      padding-top: 4px;
    }
    .cvca-name {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #1a1a1a;
      line-height: 1;
    }
    .cvca-sub {
      font-size: 0.4rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: #1a1a1a;
      text-transform: uppercase;
      line-height: 1.5;
      text-align: right;
      margin-top: 2px;
    }

    /* Meta items */
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 18px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .meta-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .meta-icon svg {
      width: 22px;
      height: 22px;
      stroke: #0D1B2A;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .meta-text {
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    /* ══════════════════════════════
       HALIFAX SKYLINE
    ══════════════════════════════ */
    .skyline-wrap {
      margin-top: 14px;
      width: 100%;
      overflow: hidden;
      line-height: 0;
      background: #fff;
    }
    .skyline-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ══════════════════════════════
       PERSON STRIP
    ══════════════════════════════ */
    .person-strip {
      margin: 0 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: #fff;
      border: 1.5px solid #D1D5DB;
      border-radius: 8px;
      padding: 14px 18px;
    }

    /* Photo with hot-pink ring */
    .photo-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 3.5px solid #F5C800;
      overflow: hidden;
      flex-shrink: 0;
      background: #f0f0f0;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: grayscale(100%) contrast(1.05);
    }

    .person-info { flex: 1; }
    .person-name {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      color: #0D1B2A;
      text-transform: uppercase;
    }
    .person-title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #F5C800;
      text-transform: uppercase;
      margin-top: 2px;
      line-height: 1.45;
    }

    .person-divider {
      width: 1.5px;
      height: 54px;
      background: #D1D5DB;
      flex-shrink: 0;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      background: #0D1B2A;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 6px;
      text-decoration: underline;
      flex-shrink: 0;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .cta-btn:hover { opacity: 0.88; }

    /* ── PRINT CONTROLS ── */
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 9px 22px;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      border-radius: 3px;
    }
    .btn-primary { background: #0D1B2A; color: #fff; }
    .btn-secondary { background: transparent; color: #555; border: 1px solid #ccc; }
    .btn:hover { opacity: 0.8; }

    @media print {
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 0; min-height: auto; }
      .controls { display: none; }
      .card { box-shadow: none; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
